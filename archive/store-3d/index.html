<template id="tape-about">
  <section class="tape-doc" data-title="About me">
    <header class="card">
      <p class="card__kicker">Disc 1 · Doha · 2026</p>
      <h2 class="card__title">Mohammed Sherin Valiyakath</h2>
      <p class="card__sub">final-year computer science, Qatar University</p>
    </header>

    <p class="lead">I'm a CS student in Doha, graduating May 2027. Most of what I build starts with something that annoyed me.</p>
    <p>Nobody was keeping a record of what Kerala's ministers say in public, so I built <a href="https://openministry.live" target="_blank" rel="noopener">openMinistry</a>. Raycast had nothing for typing Malayalam, so I wrote an extension for it. Some films only survive on Telegram now, so I wrote a userbot that pulls them into my Jellyfin server.</p>
    <p>I've also done the less glamorous side: fixing network faults on-site at supermarkets, and building a CRM in Oracle APEX for a sales team.</p>

    <h3 class="ch">Looking for</h3>
    <p>A full-time role or internship from <strong>Summer 2027</strong>. Software engineering, backend, or anything close to civic tech.</p>

    <h3 class="ch">What I work with</h3>
    <dl class="kv">
      <dt>Languages</dt><dd>Python, TypeScript, JavaScript, Java, SQL, C#</dd>
      <dt>Web</dt><dd>Next.js, React, FastAPI, Tailwind</dd>
      <dt>Data</dt><dd>PostgreSQL, Redis, Celery, Oracle Database / APEX</dd>
      <dt>Ops</dt><dd>Docker, Linux, Git, DigitalOcean, RabbitMQ, Kafka</dd>
      <dt>Networks</dt><dd>CCNA: Introduction to Networks, Cisco Packet Tracer</dd>
    </dl>

    <h3 class="ch">Spoken</h3>
    <p>Malayalam (native), English (fluent), and beginner Hindi, Tamil and Spanish.</p>

    <p class="next">Next disc: <button class="jump" data-goto="projects">PROJECTS</button> or <button class="jump" data-goto="experience">WORK</button></p>
  </section>

<template id="tape-projects">
  <section class="tape-doc" data-title="Projects">
    <header class="card">
      <p class="card__kicker">Disc 3 · Feature presentations</p>
      <h2 class="card__title">Projects</h2>
      <p class="card__sub">the ones I'd actually show you</p>
    </header>

    <article class="entry">
      <p class="entry__when">CH.01 · FOUNDER · CIVIC TECH</p>
      <h3 class="entry__title">openMinistry</h3>
      <p>A public archive of what Kerala's ministers and MLAs say on the record. It scrapes the news, uses an LLM to pull out each statement, puts it in front of a human moderator, and then publishes it to a searchable site and a public REST API.</p>
      <ul>
        <li>600+ verified statements from 140 public representatives.</li>
        <li>Microservices: FastAPI backend, Next.js frontend, a separate extraction service, and Celery workers on Redis. Deployed on DigitalOcean with Docker and PostgreSQL.</li>
        <li>The full platform is offline for now because hosting costs money. The demo is still up.</li>
      </ul>
      <p class="tags">Python · FastAPI · Next.js · PostgreSQL · Redis · Celery · Docker</p>
      <p class="links"><a href="https://openministry.live" target="_blank" rel="noopener">openministry.live ↗</a> <a href="https://github.com/mdsherinoff/openMinistry" target="_blank" rel="noopener">source ↗</a></p>
    </article>

    <article class="entry">
      <p class="entry__when">CH.02 · FOUNDER · IN DEVELOPMENT</p>
      <h3 class="entry__title">ComplyQatar</h3>
      <p>A multi-tenant app for companies in Qatar to track their licences, permits and contracts by location: red / amber / green status, renewal alerts, and a vault for the documents. Freemium, so small businesses can start free. First rollout is planned with Transind Holding.</p>
      <p class="tags">Next.js · TypeScript · Supabase / Postgres · Drizzle · row-level security</p>
    </article>

    <article class="entry">
      <p class="entry__when">CH.03 · AUTOMATION</p>
      <h3 class="entry__title">telefin</h3>
      <p>Forward a film to yourself on Telegram and it turns up in Jellyfin. It's a Telegram userbot (Telethon, MTProto) rather than a bot, which gets around the 20 MB bot limit and handles files up to 4 GB. It hands the file to Sonarr/Radarr, and they do the rest.</p>
      <p class="tags">Python · Telethon · Docker · Sonarr / Radarr / Jellyfin</p>
      <p class="links"><a href="https://github.com/mdsherinoff/telefin" target="_blank" rel="noopener">source ↗</a></p>
    </article>

    <article class="entry">
      <p class="entry__when">CH.04 · PUBLISHED ON THE RAYCAST STORE</p>
      <h3 class="entry__title">Manglish Keyboard</h3>
      <p>Type <em>namaskaram</em>, get <span lang="ml">നമസ്കാരം</span>. A Raycast extension that turns English phonetics into Malayalam script, with copy/paste straight into the app you're in and a history of recent words. It went through Raycast's store review.</p>
      <p class="tags">TypeScript · React · Raycast API · Google Input Tools</p>
      <p class="links"><a href="https://github.com/mdsherinoff/manglish-keyboard" target="_blank" rel="noopener">source ↗</a></p>
    </article>

    <h3 class="ch">Also on this disc</h3>
    <ul class="shortlist">
      <li><a href="https://github.com/mdsherinoff/ringlog" target="_blank" rel="noopener">Ringlog</a> exports iPhone call history from a local backup to Excel, CSV or an HTML report. Offline, Python.</li>
      <li><a href="https://github.com/mdsherinoff/Jellyfin.Plugin.LanguageSort" target="_blank" rel="noopener">Jellyfin LanguageSort</a> is a C# plugin that groups a library into collections by each title's <em>original</em> language, using TMDb or the script the title is written in.</li>
      <li><a href="https://bingeplan.vercel.app" target="_blank" rel="noopener">Bingely</a> builds a viewing schedule for films, shows and anime around your free time. Next.js, TMDB, Prisma.</li>
      <li><a href="https://github.com/mdsherinoff/odins-garden" target="_blank" rel="noopener">Odin's Garden</a> is a Flutter plant diary with photo timelines and a species dictionary built on GBIF.</li>
      <li><a href="https://github.com/mdsherinoff/cmps350-project" target="_blank" rel="noopener">Course Management System</a> is a uni team project with roles for students, instructors and admins. Next.js, Prisma, NextAuth, Chart.js.</li>
      <li><strong>Timeflict 3D</strong> is a Unity 6 game made by a team of three. I did the gameplay mechanics and scripted events in C#.</li>
      <li><a href="https://github.com/mdsherinoff/wc-prediction-game" target="_blank" rel="noopener">World Cup prediction pool</a> is a scoreline and bracket game for a group of friends, with results synced from football-data.org.</li>
    </ul>

    <p class="next">Everything else is on <a href="https://github.com/mdsherinoff" target="_blank" rel="noopener">GitHub ↗</a></p>
